[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = 'football-attention'
version = '0.3.0'
description = 'Shot-ending buildup prediction and attention diagnostics'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'matplotlib>=3.9,<4',
    'numpy>=1.26,<3',
    'pandas>=2.2,<3',
    'pyarrow>=17,<24',
    'scikit-learn>=1.5,<2',
    'scipy>=1.13,<2',
    'torch>=2.4,<3',
]

[project.optional-dependencies]
test = ['pytest>=8,<10']
download = ['statsbombpy==1.19.0']
hpo = ['optuna>=4.9,<5']

[project.scripts]
football-attention = 'football_attention.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I']

[tool.ruff.format]
quote-style = 'single'
